[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aitdm-fl"
version = "1.0.0"
description = "AITDM – Federated Learning with Flower, PyTorch and MONAI"
requires-python = ">=3.11"
# The exact versions are pinned in ../requirements.txt
dependencies = [
    "flwr[simulation]>=1.41.0",
    "torch>=2.4",
    "monai>=1.4",
    "numpy",
    "scikit-learn",
]

[tool.hatch.build.targets.wheel]
packages = ["aitdm_fl"]

# ---------------------------------------------------------------------------
# Flower configuration
# ---------------------------------------------------------------------------
[tool.flwr.app]
publisher = "aitdm"

[tool.flwr.app.components]
serverapp = "aitdm_fl.server_app:app"
clientapp = "aitdm_fl.client_app:app"

# Every key below can be overridden at run time, e.g.
#   flwr run . --run-config "num-server-rounds=10 strategy='fedprox'"
[tool.flwr.app.config]
# Folder created by data_splitting/split_data.py (client_<i>.npz + test.npz).
# Use an ABSOLUTE path: Flower runs the apps from its own working directory.
# The scripts in ../scripts fill this in for you.
partitions-dir = ""
# Folder where the server writes final_model.pt and metrics.json ("" = don't save)
save-dir = ""

# Seed for the model initialisation, the clients' shuffling / augmentation and
# the DP noise: the same seed gives the same result. Report mean +- std over
# seeds 1, 2, 3 (experiments/run_seeds.py does this for you).
seed = 1
num-server-rounds = 5
local-epochs = 1
learning-rate = 0.001
batch-size = 32
# "balanced": every client weights its loss by inverse class frequency (rare
# classes count more, see docs/05_gradcam.md, "The iterative process"). "none": plain loss.
loss-weighting = "none"

# Aggregation strategy (see docs/04_aggregation_strategies.md):
#   fedavg | fedprox | fedavgm | fedadam | fedyogi          (accuracy / non-IID)
#   fedmedian | fedtrimmedavg | krum                         (robustness)
#   qfedavg                                                  (fairness)
strategy = "fedavg"
proximal-mu = 0.1           # fedprox: weight of the proximal term
server-momentum = 0.9       # fedavgm
server-lr = 0.01            # fedadam / fedyogi: server learning rate (eta)
trim-beta = 0.2             # fedtrimmedavg: fraction cut from EACH end
num-malicious = 1           # krum: number of attackers it should tolerate
qfedavg-q = 0.1             # qfedavg: 0 = FedAvg, larger = fairer
qfedavg-client-lr = 1.0     # qfedavg: step-size estimate (L = 1 / this)

# Central differential privacy (wraps any strategy). 0 = off.
dp-noise-multiplier = 0.0   # noise std = multiplier * clipping-norm / #clients
dp-clipping-norm = 1.0      # max L2 norm of a client update
dp-delta = 1e-5             # delta used to report the privacy budget epsilon

# Robustness experiments: attacking clients (comma-separated partition ids)
malicious-clients = ""      # e.g. "2" or "1,3"
attack = "sign-flip"        # "sign-flip", "noise" or "none" (honest weights)
attack-inflate-examples = 1 # attackers multiply the num-examples they report (FedAvg trusts it)

# The global test set is evaluated once, after the last round. true = every
# round (for learning curves in the report, NOT for choosing settings).
test-every-round = false

fraction-train = 1.0        # fraction of connected clients used each round
fraction-evaluate = 1.0
# The server waits until this many clients are connected before starting a round.
# Set it to the number of clients you start, otherwise a round may begin
# before everybody joined (Flower's default is 2!).
min-nodes = 3
